# 小谷姐姐麻辣烫·石岛湾店
# 威海市荣成市桃源街道东山南路2号C114商业

name: 小谷姐姐麻辣烫·石岛湾店
brand: 小谷姐姐
profile: malatang

location:
  type: coastal_tourist
  city: 威海市
  district: 荣成市
  subdistrict: 桃源街道
  address: 东山南路2号C114商业
  lat: 36.88
  lng: 122.45

environment:
  nearby_residential:
    - 桃源街道居民区（周边多个小区）
    - 石岛湾花园
  nearby_attractions:
    - 石岛湾海水浴场（约1km）
    - 赤山风景区（约5km）
    - 石岛港
  nearby_commercial:
    - 东山南路沿街商铺
    - 石岛商业街
  nearby_transport:
