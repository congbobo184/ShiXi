customer_segments:
  - name: 核电工人
    description: |
      华能石岛湾核电站员工及建设人员。
      特点: 三班倒，就餐时间不规律，不是只在饭点来。
      单人为主，要快，要吃饱。消费力中等偏上。
      可能凌晨/深夜也有需求（夜班下班）。
    current_status: 未专门服务
  - name: 学生
    description: |
      周边学校学生（荣成范围）。
      特点: 消费力偏低但频次高，爱结伴，下午放学时段是高峰。
      爱发朋友圈/短视频，自带传播属性。
      对价格敏感，喜欢"看起来划算"的东西。
    current_status: 未专门服务
  - name: 渔民
    description: |
      石岛港及周边渔民。
      特点: 出海早，中午前后回港。吃饭时间集中在11-14点。
      体力劳动量大，吃得实在。对价格敏感但讲究"好吃"。
      海鲜偏好，可能与麻辣烫形成互补需求。
    current_status: 未专门服务
  - name: 留守妇女
    description: |
      渔民出海后留守在家的妇女。
      特点: 白天有时间，下午时段可能有消费需求。
      可能带孩子一起来。价格敏感，偏好"带娃友好"的环境。
      社交属性强（互相推荐）。
    current_status: 未专门服务
  - name: 本地居民
    description: |
      桃源街道及周边小区常住居民。
      特点: 稳定的日常客流基础。晚餐+夜宵为主。
      熟了之后复购率高，是淡季保命的基本盘。
    current_status: 当前主要客群
  - name: 暑期游客
    description: |
      5-10月尤其是7-8月暑期来石岛湾的游客。
      特点: 一次性消费，客单价可能偏高。吃饭时间集中。
      靠视觉决策（招牌、门口排队、大众点评）。
      喜欢"地方特色"标签。
    current_status: 5月开始有少量，7-8月爆发

local_context:
  tourist_season_months: [5, 6, 7, 8, 9, 10]
  peak_months: [7, 8]
  notes: |
    威海荣成石岛湾，沿海旅游区，东山南路沿街商铺。
    半径2公里内有核电站、渔港、学校、居民区、海水浴场。
    麻辣烫是周边唯一平价快餐品类，与海鲜馆形成差异化。
    店主为夫妻店，年长，不擅长复杂营销活动。
    荣成本地饮食偏海鲜、咸鲜口味。

constraints:
  - 无外卖（雇人挑剔，暂不开）
  - 不做复杂营销活动（父母精力有限）
  - 无会员系统
  - 无成本记账
  - 仅美团管家POS收银
